<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}자산관리 대시보드{% endblock %}</title>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
{% if user %}
<nav class="navbar navbar-expand-lg tossnav sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="/">📈 자산관리</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="/">대시보드</a>
      <a class="nav-link" href="/import">거래내역 임포트</a>
      <a class="nav-link" href="/edit-data">데이터 편집</a>
      <a class="nav-link" href="/settings">API 키 설정</a>
    </div>
    <span class="navbar-text me-3">👤 {{ user }}</span>
    <a class="btn btn-sm btn-outline-secondary" href="/logout">로그아웃</a>
  </div>
</nav>
{% endif %}
<main class="container-xxl py-4">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
