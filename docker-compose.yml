# FastAPI 웹앱 + Caddy(자동 HTTPS) 리버스 프록시
# 사용: docker compose up -d --build
# - 도메인이 있으면 .env 에 SITE_ADDRESS=example.com → Caddy가 Let's Encrypt로 HTTPS 자동 발급/갱신
# - 도메인이 없으면 SITE_ADDRESS=:80 (기본) → HTTP만 (공인 IP 접속용)
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - pfm_data:/app/user_data   # 사용자 계정/키/임포트 데이터 영속
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # 발급된 TLS 인증서 영속
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pfm_data:
  caddy_data:
  caddy_config:
